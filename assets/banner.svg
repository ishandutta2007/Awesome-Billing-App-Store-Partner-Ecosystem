<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(0.95); }
      }
      @keyframes pulse-flow {
        0% { stroke-dashoffset: 100; opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.85; }
        100% { opacity: 0.4; }
      }
      .orb-1 { animation: float1 8s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: float2 9s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 8 8; animation: pulse-flow 25s linear infinite; }
      .badge-glow { animation: shimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g filter="url(#blur-glow)">
    <circle class="orb-1" cx="250" cy="140" r="130" fill="#6366f1" opacity="0.35" />
    <circle class="orb-2" cx="950" cy="260" r="150" fill="#8b5cf6" opacity="0.3" />
    <circle class="orb-1" cx="620" cy="360" r="120" fill="#ec4899" opacity="0.25" />
  </g>

  <!-- Cyber Grid Lines in Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.18">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Network Connection Flows (Background) -->
  <g fill="none" stroke="#6366f1" stroke-width="2">
    <path class="flow-line" d="M 80 320 Q 300 180 600 240 T 1120 180" />
    <path class="flow-line" stroke="#ec4899" d="M 120 120 Q 400 340 780 200 T 1140 310" />
  </g>

  <!-- Foreground Content Block (guaranteed high contrast & readability) -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <!-- Top Category Pill -->
    <g transform="translate(0, -95)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="2">
        ⚡ AWESOME CURATED ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Billing &amp; App Store Partner Ecosystem
    </text>

    <!-- Gradient Highlight Underline / Accent -->
    <rect x="-180" y="16" width="360" height="4" rx="2" fill="url(#primary-glow)" />

    <!-- Subtitle -->
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Recurring Billing Platforms • Developer Marketplaces • ISV Partner Infrastructure
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 115)">
      <!-- Pill 1: SaaS Benchmarks -->
      <g transform="translate(-290, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">💳 SaaS Benchmarks</text>
      </g>

      <!-- Pill 2: App Marketplaces -->
      <g transform="translate(-95, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7">🏬 App Marketplaces</text>
      </g>

      <!-- Pill 3: Open-Source Engines -->
      <g transform="translate(100, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">🔓 Open-Source Engines</text>
      </g>

      <!-- Pill 4: Partner Monetization -->
      <g transform="translate(295, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">🤝 Partner Monetization</text>
      </g>
    </g>
  </g>
</svg>
